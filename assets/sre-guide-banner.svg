<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">SRE em produção: do alerta de CPU ao SLO, burn rate e IA</title>
  <desc id="description">Banner do guia. Painel estilo terminal com o error budget de um serviço e uma barra de burn-down em zonas verde, âmbar e vermelha.</desc>

  <!-- fundo plano, paleta de painel de confiabilidade -->
  <rect width="1200" height="300" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- espinha de severidade: verde (ok) / âmbar (alerta) / vermelho (violação) -->
  <g>
    <rect x="0" y="44" width="6" height="72" rx="3" fill="#2ea043"/>
    <rect x="0" y="118" width="6" height="64" rx="3" fill="#d29922"/>
    <rect x="0" y="184" width="6" height="72" rx="3" fill="#da3633"/>
  </g>

  <!-- coluna de texto -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="64" y="92" fill="#3fb950" font-size="15" font-weight="700" letter-spacing="3">SITE RELIABILITY ENGINEERING</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="152" fill="#f0f6fc" font-size="54" font-weight="800">SRE em produção</text>
    <text x="64" y="196" fill="#8b949e" font-size="23" font-weight="400">Do alerta de CPU ao SLO, ao burn rate e à IA.</text>
    <text x="64" y="232" fill="#6e7681" font-size="15">Português · revisão nov/2026 · baseado em fontes primárias</text>
  </g>

  <!-- painel terminal -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <rect x="712" y="44" width="440" height="216" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- barra de título da janela -->
    <path d="M712 56a12 12 0 0 1 12 -12h416a12 12 0 0 1 12 12v24h-440z" fill="#21262d"/>
    <circle cx="736" cy="64" r="6" fill="#ff5f56"/>
    <circle cx="758" cy="64" r="6" fill="#ffbd2e"/>
    <circle cx="780" cy="64" r="6" fill="#27c93f"/>
    <text x="804" y="69" fill="#8b949e" font-size="13">slo status checkout</text>

    <!-- corpo -->
    <text x="740" y="116" fill="#6e7681" font-size="14"># error budget · checkout · 30 dias</text>

    <text x="740" y="148" fill="#8b949e" font-size="15">SLO</text>
    <text x="1124" y="148" fill="#3fb950" font-size="15" font-weight="700" text-anchor="end">99.9% ok</text>

    <text x="740" y="180" fill="#8b949e" font-size="15">consumido</text>
    <text x="1124" y="180" fill="#e3b341" font-size="15" font-weight="700" text-anchor="end">62%</text>

    <!-- burn-down por zonas: verde (0-50%) âmbar (50-80%) vermelho (80-100%); preenchido até 62% -->
    <g>
      <rect x="740"  y="196" width="33" height="14" rx="3" fill="#3fb950"/>
      <rect x="779"  y="196" width="33" height="14" rx="3" fill="#3fb950"/>
      <rect x="818"  y="196" width="33" height="14" rx="3" fill="#3fb950"/>
      <rect x="857"  y="196" width="33" height="14" rx="3" fill="#3fb950"/>
      <rect x="896"  y="196" width="33" height="14" rx="3" fill="#3fb950"/>
      <rect x="935"  y="196" width="33" height="14" rx="3" fill="#d29922"/>
      <rect x="974"  y="196" width="33" height="14" rx="3" fill="#21262d"/>
      <rect x="1013" y="196" width="33" height="14" rx="3" fill="#21262d"/>
      <rect x="1052" y="196" width="33" height="14" rx="3" fill="#21262d"/>
      <rect x="1091" y="196" width="33" height="14" rx="3" fill="#21262d"/>
    </g>

    <text x="740" y="242" fill="#8b949e" font-size="15">alerta</text>
    <text x="1124" y="242" fill="#f85149" font-size="15" font-weight="700" text-anchor="end">burn &gt; 14.4x · page</text>
  </g>
</svg>
